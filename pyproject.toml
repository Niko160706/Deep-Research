[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "drx"
version = "0.1.0"
description = "Deep Research AI Agent - Dual-Stream investigative pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "keyring>=25.7,<27",
    "pydantic>=2.10,<3",
    "secretstorage>=3.3,<4",
    "typesafe-sdk==0.7.2",
]

[project.scripts]
gidr-check-config = "gidr.bootstrap:main"
gidr-credential = "gidr.infrastructure.security.credentials_cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
    "setuptools==84.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gidr*"]

[tool.setuptools.package-data]
gidr = ["py.typed", "infrastructure/db/migrations/*.sql"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/gidr"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "BLE001",   # broad `except Exception` is intentional for graceful degradation
    "S110",     # try/except/pass is intentional around optional dependencies
    "SIM117",   # nested `with` is clearer for timeout-scoped aiohttp sessions
    "SIM102",   # nested `if` is more readable in the orchestrator guard
]
